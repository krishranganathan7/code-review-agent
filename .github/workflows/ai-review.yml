# AI code review, triggered when a pull request is opened or updated.
#
# `pull_request` (never `pull_request_target`): a fork PR then runs WITHOUT the
# repository's secrets, so it simply will not review rather than handing AWS
# credentials to code the fork author wrote. This job pip-installs and executes
# the reviewer from the merge commit, so `pull_request_target` here would be
# arbitrary code execution with a live credential in scope.
#
# The reviewer does not vote on the PR. It posts findings as a COMMENT review and
# reports the deterministic gate's verdict through this job's exit code:
# pass/warn -> 0 (green), block -> 1 (red), error -> 2. Making this a required
# status check is what turns that into a merge block -- the bot never approves or
# requests changes itself.

name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the review in flight; no point paying for the old one.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege, matching `reviewer --scopes`.
# `pull-requests: write` is needed only because of `--publish`; drop it to
# `read` if you take that flag off.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          # The reviewer materializes its sandbox with `git archive <head sha>`,
          # so that exact commit has to be present locally.
          ref: ${{ github.event.pull_request.head.sha }}
          # Full history: `git_history` is one of the six search tools, and a
          # shallow clone degrades it silently rather than failing.
          fetch-depth: 0

      - name: Install ripgrep
        # The `grep` tool shells out to ripgrep and refuses to fall back to a
        # weaker search, because "no matches" from a lesser searcher is
        # indistinguishable from "no matches" from ripgrep. Not preinstalled on
        # GitHub-hosted runners.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewer
        run: pip install --quiet -e "./tools/reviewer[bedrock]"

      - name: Review
        env:
          # Supplied by Actions; scoped by the `permissions:` block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository secrets -- see tools/reviewer/README.md for setup.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          REVIEWER_MODEL: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python -m reviewer.run_review \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" \
            --clone . \
            --publish \
            --trace review-trace.json

      - name: Upload the review trace
        # `always()`: the trace is most useful precisely when the job failed,
        # which is exactly when a blocking finding was published.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-trace-pr-${{ github.event.pull_request.number }}
          path: review-trace.json
          if-no-files-found: warn

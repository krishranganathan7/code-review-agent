# AI code review, triggered when a pull request is opened or updated.
#
# `pull_request` (never `pull_request_target`): a fork PR then runs WITHOUT the
# repository's secrets, so it simply will not review rather than handing AWS
# credentials to code the fork author wrote. This job pip-installs and executes
# a reviewer, so `pull_request_target` here would be arbitrary code execution
# with live credentials in scope.
#
# The reviewer does not vote on the PR. It posts findings as a COMMENT review and
# reports the deterministic gate's verdict through this job's exit code:
# pass/warn -> 0 (green), block -> 1 (red), error -> 2. Making this a required
# status check is what turns that into a merge block -- the bot never approves or
# requests changes itself.

name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push supersedes the review in flight; no point paying for the old one.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege, matching `reviewer --scopes`.
# `pull-requests: write` is needed only because of `--publish`; drop it to
# `read` if you take that flag off.
permissions:
  contents: read
  pull-requests: write

env:
  # The reviewer lives in its own private repository. Pinning to a branch means
  # improvements land without touching this file, which is what a testing phase
  # wants; pin to a tag once the behaviour needs to be reproducible.
  REVIEWER_REPO: moder-mai/mai-code-review-agent
  REVIEWER_REF: main

jobs:
  review:
    name: Review pull request
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.pull_request.draft == false

    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          # Deliberately the DEFAULT ref -- the pull request's merge commit --
          # and not `head.sha`. The working tree has to carry `tools/reviewer/`,
          # which lives on the base branch; a PR branch cut before the reviewer
          # was vendored does not have it, and checking out the head would fail
          # the install step on every such pull request.
          #
          # The reviewer does not read the working tree anyway: it materializes
          # its own sandbox with `git archive <head sha>`, and that needs the
          # commit as an *object*, not as a checkout. The merge commit's second
          # parent is the head, so with full history it is present.
          #
          # Full history also matters because `git_history` is one of the six
          # search tools, and a shallow clone degrades it silently.
          fetch-depth: 0

      - name: Install ripgrep
        # The `grep` tool shells out to ripgrep and refuses to fall back to a
        # weaker search, because "no matches" from a lesser searcher is
        # indistinguishable from "no matches" from ripgrep. Not preinstalled on
        # GitHub-hosted runners.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ripgrep

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the reviewer
        env:
          # A CLASSIC personal access token with the `repo` scope.
          #
          # Not the built-in GITHUB_TOKEN: that is scoped to the repository
          # running the workflow and cannot read a second one.
          #
          # Not a fine-grained PAT, and not a deploy key: `moder-mai` gates the
          # first behind organisation approval and disables the second outright.
          # A classic PAT belongs to the user rather than to a resource owner,
          # so it needs nobody's approval -- at the cost of being broad. `repo`
          # is the narrowest classic scope that can read a private repository,
          # and it carries read AND write to every repository its owner can
          # reach. Keep the expiry short and revoke it when the test is done;
          # move to a fine-grained token or a deploy key once the org allows one.
          #
          # Actions masks registered secrets in logs, so the token does not
          # appear even though pip echoes the URL it was given.
          REVIEWER_REPO_TOKEN: ${{ secrets.REVIEWER_REPO_TOKEN }}
        run: |
          pip install --quiet "reviewer[bedrock] @ git+https://x-access-token:${REVIEWER_REPO_TOKEN}@github.com/${REVIEWER_REPO}.git@${REVIEWER_REF}"

      - name: Review
        env:
          # Supplied by Actions; scoped by the `permissions:` block above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository secrets -- see .github/AI_REVIEW.md for setup.
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1
          REVIEWER_MODEL: bedrock/us.anthropic.claude-sonnet-4-5-20250929-v1:0
          PR_NUMBER: ${{ github.event.pull_request.number }}
          FAIL_ON_BLOCK: ${{ vars.FAIL_ON_BLOCK || 'false' }}
        run: |
          set +e
          python -m reviewer.run_review \
            "$GITHUB_REPOSITORY" "$PR_NUMBER" \
            --clone . \
            --publish \
            --trace review-trace.json 2>&1 | tee review.log
          code=${PIPESTATUS[0]}
          set -e

          # Exit codes: 0 pass/warn, 1 a blocking finding, 2 the reviewer itself
          # failed. Only the last of those is a broken job.
          case "$code" in
            0) verdict="PASS or WARN" ;;
            1) verdict="BLOCK" ;;
            *) verdict="REVIEWER ERROR" ;;
          esac

          {
            echo "## AI review: $verdict"
            echo
            echo "Findings are posted on the pull request; full detail is in the"
            echo "\`review-trace-pr-${PR_NUMBER}\` artifact on this run."
            echo
            echo '```'
            tail -n 4 review.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A reviewer error always fails the job: nothing was reviewed, and a
          # green check would be claiming otherwise.
          if [ "$code" -ge 2 ]; then
            echo "::error::the reviewer did not complete (exit $code)"
            exit "$code"
          fi

          # A blocking finding is a verdict, not a malfunction, and whether it
          # should fail the job depends on what the job is for. As a required
          # status check it must -- that is the merge gate. While the review is
          # still being calibrated it should not, because a red X on every pull
          # request teaches people to ignore it.
          #
          # Set the repository variable FAIL_ON_BLOCK=true to arm the gate.
          if [ "$code" -eq 1 ]; then
            echo "::warning::blocking findings were published -- see the pull request"
            if [ "$FAIL_ON_BLOCK" = "true" ]; then
              exit 1
            fi
          fi
          exit 0

      - name: Upload the review trace
        # `always()`: the trace is most useful precisely when the job failed,
        # which is exactly when a blocking finding was published.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-trace-pr-${{ github.event.pull_request.number }}
          path: review-trace.json
          if-no-files-found: warn

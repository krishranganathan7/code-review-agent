[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewer"
version = "0.0.0"
description = "LLM-provider-agnostic PR review agent using agentic search"
requires-python = ">=3.11"
license = { text = "Proprietary" }
# Provider SDKs are used only inside src/reviewer/providers/. Bedrock needs the
# `bedrock` extra, which pulls boto3 -- install with: pip install -e ".[bedrock]"
dependencies = [
  "anthropic>=0.40",
  "openai>=1.45",
]

[project.optional-dependencies]
bedrock = [
  "anthropic[bedrock]>=0.40",
]

[project.scripts]
reviewer = "reviewer.run_review:main"

[tool.setuptools.packages.find]
where = ["src"]
